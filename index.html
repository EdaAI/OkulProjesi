<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D AR Okul Kampüsü</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker preset="hiro">
        
        <a-entity id="tum-kampus" position="0 0 0" scale="0.8 0.8 0.8">
          
          <a-plane position="0 0 0" rotation="-90 0 0" width="4" height="4" color="#388E3C"></a-plane>
          
          <a-plane position="0 0.01 0" rotation="-90 0 0" width="0.4" height="4" color="#757575"></a-plane>
          <a-plane position="0 0.01 0" rotation="-90 90 0" width="0.4" height="4" color="#757575"></a-plane>

          <a-box position="-0.9 0.4 -0.9" width="1.4" height="0.8" depth="1" color="#ECEFF1">
            <a-cone position="0 0.6 0" radius-bottom="1" radius-top="0" height="0.4" rotation="0 45 0" color="#D32F2F" segments-radial="4"></a-cone>
            <a-box position="0 -0.25 0.51" width="0.3" height="0.3" depth="0.02" color="#5D4037"></a-box>
            <a-box position="0 -0.38 0.55" width="0.4" height="0.05" depth="0.1" color="#B0BEC5"></a-box>
            <a-box position="-0.4 0.1 0.51" width="0.15" height="0.15" depth="0.01" color="#00B0FF"></a-box>
            <a-box position="0.4 0.1 0.51" width="0.15" height="0.15" depth="0.01" color="#00B0FF"></a-box>
            <a-box position="0 0.3 0.51" width="0.8" height="0.12" depth="0.01" color="#1A237E"></a-box>
          </a-box>

          <a-plane position="0.9 0.02 0.9" rotation="-90 0 0" width="1.6" height="1.1" color="#1B5E20">
            <a-plane position="0 0 0.001" width="1.5" height="1" color="#FFFFFF" material="wireframe: true; wireframeLinewidth: 2"></a-plane>
          </a-plane>
          <a-entity position="1.65 0 0.9">
            <a-box position="0 0.15 0" width="0.02" height="0.3" depth="0.3" material="wireframe: true" color="white"></a-box>
          </a-entity>
          <a-entity position="0.15 0 0.9">
            <a-box position="0 0.15 0" width="0.02" height="0.3" depth="0.3" material="wireframe: true" color="white"></a-box>
          </a-entity>

          <a-cylinder position="0.9 0.02 -0.9" radius="0.4" height="0.1" color="#78909C">
            <a-cylinder position="0 0.04 0" radius="0.36" height="0.02" color="#4FC3F7" opacity="0.8"></a-cylinder>
            <a-cone position="0 0.15 0" radius-bottom="0.02" radius-top="0.1" height="0.2" color="#E0F7FA" opacity="0.6"></a-cone>
          </a-cylinder>

          <a-plane position="-0.9 0.02 0.9" rotation="-90 0 0" width="1.2" height="1.2" color="#FFB300"></a-plane>
          <a-box position="-0.9 0.1 0.9" rotation="0 0 30" width="0.4" height="0.02" depth="0.1" color="#FF5722"></a-box>
          <a-box position="-0.7 0.03 0.7" width="0.4" height="0.05" depth="0.4" color="#8D6E63">
            <a-box position="0 0.01 0" width="0.36" height="0.04" depth="0.36" color="#FFE082"></a-box>
          </a-box>

          <a-plane position="0 0.02 -0.9" rotation="-90 0 0" width="1" height="1" color="#9C27B0"></a-plane>
          <a-box position="0 0.05 -0.7" width="0.15" height="0.1" depth="0.15" color="#37474F"></a-box>
          <a-torus-knot position="0 0.22 -0.7" radius="0.06" radius-tubular="0.015" color="#FF9800" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"></a-torus-knot>

          <a-cylinder position="-0.2 0.1 0.5" radius="0.02" height="0.2" color="#5D4037"></a-cylinder>
          <a-sphere position="-0.2 0.22 0.5" radius="0.1" color="#2E7D32"></a-sphere>
          <a-cylinder position="0.3 0.1 -0.3" radius="0.02" height="0.2" color="#5D4037"></a-cylinder>
          <a-sphere position="0.3 0.22 -0.3" radius="0.1" color="#2E7D32"></a-sphere>

        </a-entity>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    
  </body>
</html>
