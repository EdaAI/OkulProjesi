<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Profesyonel Realistik 3D AR Kampüs Maketi</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_matrix; matrixCodeType: 3x3; trackingMethod: best; smooth: true; smoothCount: 30; smoothTolerance: 0.001; smoothThreshold: 2;"
             gesture-detector>
      
      <a-entity light="type: ambient; intensity: 0.6; color: #FFF"></a-entity>
      <a-entity light="type: directional; intensity: 0.8; castShadow: true;" position="2 4 3"></a-entity>

      <a-marker preset="hiro" raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayorigin: mouse;">
        
        <a-entity id="kampus-maketi" position="0 0 0" scale="0.45 0.45 0.45">
          
          <a-plane position="0 0 0" rotation="-90 0 0" width="4" height="4" 
                   src="url(https://upload.wikimedia.org/wikipedia/commons/a/a8/Grass_seamless_texture.jpg)" 
                   material="repeat: 4 4; roughness: 0.8"></a-plane>
          
          <a-plane position="0 0.01 0" rotation="-90 0 0" width="0.4" height="4" color="#555555" material="roughness: 1"></a-plane>
          <a-plane position="0 0.01 0" rotation="-90 90 0" width="0.4" height="4" color="#555555" material="roughness: 1"></a-plane>

          <a-entity position="-0.9 0 -0.9">
            <a-box position="0 0.4 0" width="1.4" height="0.8" depth="1.1" 
                   src="url(https://upload.wikimedia.org/wikipedia/commons/c/c2/Brick_Wall_Texture.jpg)"
                   material="repeat: 2 1.5"></a-box>
            <a-box position="0 0.4 0.56" width="0.5" height="0.8" depth="0.1" color="#ECEFF1"></a-box>
            <a-cone position="0 0.9 0" radius-bottom="1.1" radius-top="0" height="0.4" rotation="0 45 0" 
                    src="url(https://upload.wikimedia.org/wikipedia/commons/9/9d/Roof_tiles_texture.jpg)" 
                    segments-radial="4" material="repeat: 3 1"></a-cone>
            <a-box position="0 0.15 0.62" width="0.25" height="0.3" depth="0.02" color="#3E2723"></a-box>
            <a-box position="0 0.02 0.7" width="0.4" height="0.04" depth="0.15" color="#78909C"></a-box>
            <a-box position="-0.4 0.5 0.562" width="0.16" height="0.16" depth="0.01" color="#00E5FF" material="metalness: 0.6; roughness: 0.1"></a-box>
            <a-box position="0.4 0.5 0.562" width="0.16" height="0.16" depth="0.01" color="#00E5FF" material="metalness: 0.6; roughness: 0.1"></a-box>
            <a-box position="-0.4 0.25 0.562" width="0.16" height="0.16" depth="0.01" color="#00E5FF" material="metalness: 0.6; roughness: 0.1"></a-box>
            <a-box position="0.4 0.25 0.562" width="0.16" height="0.16" depth="0.01" color="#00E5FF" material="metalness: 0.6; roughness: 0.1"></a-box>
          </a-entity>

          <a-entity position="0.9 0 0.9">
            <a-plane position="0 0.02 0" rotation="-90 0 0" width="1.6" height="1.2" color="#2E7D32"></a-plane>
            <a-plane position="0 0.022 -0.57" rotation="-90 0 0" width="1.54" height="0.02" color="#FFFFFF"></a-plane>
            <a-plane position="0 0.022 0.57" rotation="-90 0 0" width="1.54" height="0.02" color="#FFFFFF"></a-plane>
            <a-plane position="-0.76 0.022 0" rotation="-90 0 0" width="0.02" height="1.14" color="#FFFFFF"></a-plane>
            <a-plane position="0.76 0.022 0" rotation="-90 0 0" width="0.02" height="1.14" color="#FFFFFF"></a-plane>
            <a-plane position="0 0.023 0" rotation="-90 0 0" width="0.02" height="1.14" color="#FFFFFF"></a-plane>
            <a-entity position="-0.75 0.02 0">
              <a-box position="0 0.12 -0.15" width="0.02" height="0.25" depth="0.02" color="#FFF"></a-box>
              <a-box position="0 0.12 0.15" width="0.02" height="0.25" depth="0.02" color="#FFF"></a-box>
              <a-box position="0 0.24 0" width="0.02" height="0.02" depth="0.3" color="#FFF"></a-box>
            </a-entity>
            <a-entity position="0.75 0.02 0">
              <a-box position="0 0.12 -0.15" width="0.02" height="0.25" depth="0.02" color="#FFF"></a-box>
              <a-box position="0 0.12 0.15" width="0.02" height="0.25" depth="0.02" color="#FFF"></a-box>
              <a-box position="0 0.24 0" width="0.02" height="0.02" depth="0.3" color="#FFF"></a-box>
            </a-entity>
          </a-entity>

          <a-entity position="0.9 0 -0.9">
            <a-cylinder position="0 0.05 0" radius="0.45" height="0.1" color="#37474F"></a-cylinder>
            <a-cylinder position="0 0.08 0" radius="0.4" height="0.04" color="#00B0FF" opacity="0.8" material="metalness: 0.5; roughness: 0.1"></a-cylinder>
            <a-cone position="0 0.18 0" radius-bottom="0.01" radius-top="0.08" height="0.2" color="#E0F7FA" opacity="0.7"></a-cone>
          </a-entity>

          <a-entity position="-0.9 0 0.9">
            <a-plane position="0 0.02 0" rotation="-90 0 0" width="1.3" height="1.3" 
                     src="url(https://upload.wikimedia.org/wikipedia/commons/d/d3/Sand_Texture.jpg)" material="repeat: 2 2"></a-plane>
            <a-box position="-0.3 0.2 0.3" width="0.15" height="0.4" depth="0.15" color="#E91E63"></a-box>
            <a-box position="0.3 0.2 0.3" width="0.15" height="0.4" depth="0.15" color="#9C27B0"></a-box>
            <a-box position="0 0.35 0.3" width="0.45" height="0.03" depth="0.1" color="#FFEB3B"></a-box>
            <a-box position="0.3 0.18 -0.02" rotation="25 0 0" width="0.12" height="0.4" depth="0.02" color="#4CAF50"></a-box>
          </a-entity>

          <a-entity position="0 0 -0.8">
            <a-plane position="0 0.02 0" rotation="-90 0 0" width="0.8" height="0.8" 
                     src="url(https://upload.wikimedia.org/wikipedia/commons/7/70/Granite_Texture.jpg)"></a-plane>
            <a-box position="0 0.08 0" width="0.18" height="0.15" depth="0.18" color="#212121"></a-box>
            <a-torus-knot position="0 0.3 0" radius="0.06" radius-tubular="0.015" color="#FFD700" 
                          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
                          material="metalness: 0.9; roughness: 0.1"></a-box>
          </a-entity>

          <a-entity position="-0.3 0 0.4"><a-cylinder radius="0.02" height="0.2" color="#5D4037"></a-cylinder><a-sphere position="0 0.12 0" radius="0.1" color="#1B5E20"></a-sphere></a-entity>
          <a-entity position="0.4 0 -0.4"><a-cylinder radius="0.02" height="0.18" color="#5D4037"></a-cylinder><a-sphere position="0 0.1" radius="0.09" color="#1B5E20"></a-sphere></a-entity>

        </a-entity>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    
  </body>
</html>
