<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D Profesyonel AR Kampüs Maketi</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 15; smoothTolerance: 0.01; smoothThreshold: 5;">
      
      <a-entity light="type: ambient; intensity: 0.8; color: #FFF"></a-entity>
      <a-entity light="type: directional; intensity: 0.6;" position="-1 2 1"></a-entity>

      <a-marker preset="hiro">
        
        <a-entity id="kampus-maketi" position="0 0 0" scale="0.45 0.45 0.45">
          
          <a-plane position="0 0 0" rotation="-90 0 0" width="4" height="4" color="#4CAF50"></a-plane>
          <a-plane position="0 0.01 0" rotation="-90 0 0" width="0.5" height="4" color="#ECEFF1"></a-plane>
          <a-plane position="0 0.01 0" rotation="-90 90 0" width="0.5" height="4" color="#ECEFF1"></a-plane>

          <a-entity position="-0.9 0 -0.9">
            <a-box position="0 0.4 0" width="1.5" height="0.8" depth="1.1" color="#FAFAFA"></a-box>
            <a-box position="0 0.4 0.56" width="0.5" height="0.8" depth="0.1" color="#CFD8DC"></a-box>
            <a-cone position="0 0.9 0" radius-bottom="1.1" radius-top="0" height="0.4" rotation="0 45 0" color="#B71C1C" segments-radial="4"></a-cone>
            <a-box position="0 0.15 0.62" width="0.25" height="0.3" depth="0.02" color="#3E2723"></a-box>
            <a-box position="0 0.02 0.7" width="0.4" height="0.04" depth="0.15" color="#90A4AE"></a-box>
            <a-box position="0 0.06 0.65" width="0.35" height="0.04" depth="0.12" color="#78909C"></a-box>
            <a-box position="-0.4 0.5 0.56" width="0.15" height="0.15" depth="0.02" color="#00E5FF"></a-box>
            <a-box position="0.4 0.5 0.56" width="0.15" height="0.15" depth="0.02" color="#00E5FF"></a-box>
            <a-box position="-0.4 0.25 0.56" width="0.15" height="0.15" depth="0.02" color="#00E5FF"></a-box>
            <a-box position="0.4 0.25 0.56" width="0.15" height="0.15" depth="0.02" color="#00E5FF"></a-box>
          </a-entity>

          <a-entity position="0.9 0 0.9">
            <a-plane position="0 0.02 0" rotation="-90 0 0" width="1.6" height="1.2" color="#1B5E20"></a-plane>
            <a-plane position="0 0.025 0" rotation="-90 0 0" width="1.5" height="1.1" color="#FFF" material="wireframe: true; wireframeLinewidth: 4"></a-plane>
            <a-plane position="0 0.026 0" rotation="-90 0 0" width="0.03" height="1.1" color="#FFF"></a-plane>
            <a-entity position="-0.75 0.02 0">
              <a-box position="0 0.12 -0.15" width="0.02" height="0.25" depth="0.02" color="#FFF"></a-box>
              <a-box position="0 0.12 0.15" width="0.02" height="0.25" depth="0.02" color="#FFF"></a-box>
              <a-box position="0 0.24 0" width="0.02" height="0.02" depth="0.3" color="#FFF"></a-box>
            </a-entity>
            <a-entity position="0.75 0.02 0">
              <a-box position="0 0.12 -0.15" width="0.02" height="0.25" depth="0.02" color="#FFF"></a-box>
              <a-box position="0 0.12 0.15" width="0.02" height="0.25" depth="0.02" color="#FFF"></a-box>
              <a-box position="0 0.24 0" width="0.02" height="0.02" depth="0.3" color="#FFF"></a-box>
            </a-entity>
          </a-entity>

          <a-entity position="0.9 0 -0.9">
            <a-cylinder position="0 0.05 0" radius="0.45" height="0.1" color="#37474F"></a-cylinder>
            <a-cylinder position="0 0.08 0" radius="0.4" height="0.04" color="#00B0FF" opacity="0.85"></a-cylinder>
            <a-cone position="0 0.2 0" radius-bottom="0.01" radius-top="0.1" height="0.2" color="#E0F7FA" opacity="0.7"></a-cone>
            <a-cone position="0 0.1 0" radius-bottom="0.05" radius-top="0.2" height="0.1" color="#B2EBF2" opacity="0.5"></a-cone>
          </a-entity>

          <a-entity position="-0.9 0 0.9">
            <a-plane position="0 0.02 0" rotation="-90 0 0" width="1.3" height="1.3" color="#FFCC80"></a-plane>
            <a-box position="-0.3 0.2 0.3" width="0.15" height="0.4" depth="0.15" color="#E91E63"></a-box>
            <a-box position="0.3 0.2 0.3" width="0.15" height="0.4" depth="0.15" color="#9C27B0"></a-box>
            <a-box position="0 0.35 0.3" width="0.45" height="0.03" depth="0.1" color="#FFEB3B"></a-box>
            <a-box position="0.3 0.18 -0.02" rotation="25 0 0" width="0.12" height="0.4" depth="0.02" color="#00CD66"></a-box>
            <a-box position="-0.2 0.25 -0.3" width="0.02" height="0.5" depth="0.02" color="#795548"></a-box>
            <a-box position="0.2 0.25 -0.3" width="0.02" height="0.5" depth="0.02" color="#795548"></a-box>
            <a-box position="0 0.48 -0.3" width="0.4" height="0.02" depth="0.02" color="#795548"></a-box>
          </a-entity>

          <a-entity position="0 0 -0.8">
            <a-plane position="0 0.02 0" rotation="-90 0 0" width="0.8" height="0.8" color="#E1BEE7"></a-plane>
            <a-box position="0 0.08 0" width="0.18" height="0.15" depth="0.18" color="#424242"></a-box>
            <a-torus-knot position="0 0.3 0" radius="0.06" radius-tubular="0.015" color="#FFD700" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-torus-knot>
          </a-entity>

          <a-entity position="-0.3 0 0.4"><a-cylinder radius="0.02" height="0.2" color="#5D4037"></a-cylinder><a-sphere position="0 0.12 0" radius="0.1" color="#2E7D32"></a-sphere></a-entity>
          <a-entity position="0.4 0 -0.4"><a-cylinder radius="0.02" height="0.18" color="#5D4037"></a-cylinder><a-sphere position="0 0.1 0" radius="0.09" color="#2E7D32"></a-sphere></a-entity>
          <a-entity position="-1.3 0 -0.2"><a-cylinder radius="0.02" height="0.22" color="#5D4037"></a-cylinder><a-sphere position="0 0.13 0" radius="0.11" color="#1B5E20"></a-sphere></a-entity>

        </a-entity> </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    
  </body>
</html>
