<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Profesyonel 3D Kampüs Projesi</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; smooth: true; smoothCount: 15; smoothTolerance: 0.01;">
      
      <a-entity light="type: ambient; intensity: 0.7; color: #FFF"></a-entity>
      <a-entity light="type: directional; intensity: 0.8; castShadow: true;" position="1 4 3"></a-entity>

      <a-marker preset="hiro">
        
        <a-entity id="profesyonel-kampus" position="0 0 0" scale="0.3 0.3 0.3">
          
          <a-plane position="0 0 0" rotation="-90 0 0" width="5" height="5" color="#4CAF50"></a-plane>

          <a-entity gltf-model="url(https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Structure/glTF/Structure.gltf)" 
                    position="-1 0 -1" 
                    scale="0.2 0.2 0.2">
          </a-entity>

          <a-entity gltf-model="url(https://raw.githubusercontent.com/n5ro/aframe-physics-system/master/examples/models/playground.gltf)" 
                    position="1 0 1" 
                    scale="0.5 0.5 0.5">
          </a-entity>

          <a-cylinder position="1 0.05 -1" radius="0.5" height="0.1" color="#78909C">
            <a-cylinder position="0 0.03 0" radius="0.45" height="0.05" color="#00E5FF" opacity="0.8"
                        animation="property: material.opacity; to: 0.5; dur: 1500; dir: alternate; loop: true"></a-cylinder>
          </a-cylinder>

          <a-entity position="-1 0 1">
            <a-box position="0 0.1 0" width="0.4" height="0.2" depth="0.4" color="#212121"></a-box>
            <a-torus-knot position="0 0.5 0" radius="0.15" radius-tubular="0.02" color="#FFD700"
                          animation="property: rotation; to: 0 360 360; loop: true; dur: 6000; easing: linear">
            </a-torus-knot>
          </a-entity>

          <a-entity position="0 0 0" gltf-model="url(https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Box/glTF/Box.gltf)" scale="0.1 0.1 0.1"></a-entity>

        </a-entity>
        
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
    
  </body>
</html>
