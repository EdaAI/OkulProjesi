<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D AR Kampüs Maketi - Optimize Edilmiş Sürüm</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_matrix; matrixCodeType: 3x3; trackingMethod: best; smooth: true; smoothCount: 10; smoothTolerance: 0.01; smoothThreshold: 2;">
      
      <a-assets>
        <a-mixin id="pencere" geometry="primitive: box; width: 0.16; height: 0.16; depth: 0.02" material="color: #00E5FF"></a-mixin>
        <a-mixin id="agac-govde" geometry="primitive: cylinder; radius: 0.02" material="color: #5D4037"></a-mixin>
        <a-mixin id="agac-yaprak" geometry="primitive: sphere" material="color: #2E7D32"></a-mixin>
        <a-mixin id="saha-cizgisi" geometry="primitive: plane; width: 0.03" material="color: #FFFFFF"></a-mixin>
        <a-mixin id="kale-diregi" geometry="primitive: box; width: 0.02; height: 0.25; depth: 0.02" material="color: #FFF"></a-mixin>
      </a-assets>

      <a-entity light="type: ambient; intensity: 0.7; color: #FFFFFF"></a-entity>
      <a-entity light="type: directional; intensity: 0.5;" position="1 3 2"></a-entity>

      <a-marker preset="hiro">
        
        <a-entity id="kampus-maketi" position="0 0 0" scale="0.45 0.45 0.45">
          
          <a-plane position="0 0 0" rotation="-90 0 0" width="4" height="4" color="#388E3C"></a-plane>
          
          <a-plane position="0 0.005 0" rotation="-90 0 0" width="0.4" height="4" color="#CFD8DC"></a-plane>
          <a-plane position="0 0.006 0" rotation="-90 90 0" width="0.4" height="4" color="#CFD8DC"></a-plane>

          <a-entity position="-0.9 0 -0.9">
            <a-box position="0 0.4 0" width="1.4" height="0.8" depth="1.1" color="#ECEFF1"></a-box>
            <a-box position="0 0.4 0.56" width="0.5" height="0.8" depth="0.1" color="#B0BEC5"></a-box>
            <a-cone position="0 0.9 0" radius-bottom="1.1" radius-top="0" height="0.4" rotation="0 45 0" color="#D32F2F" segments-radial="4"></a-cone>
            <a-box position="0 0.15 0.62" width="0.25" height="0.3" depth="0.02" color="#5D4037"></a-box>
            <a-box position="0 0.01 0.7" width="0.4" height="0.04" depth="0.15" color="#90A4AE"></a-box>
            <a-entity mixin="pencere" position="-0.4 0.5 0.561"></a-entity>
            <a-entity mixin="pencere" position="0.4 0.5 0.561"></a-entity>
            <a-entity mixin="pencere" position="-0.4 0.25 0.561"></a-entity>
            <a-entity mixin="pencere" position="0.4 0.25 0.561"></a-entity>
            <a-box position="0 0.3 0.562" width="0.8" height="0.1" depth="0.01" color="#1A237E"></a-box>
          </a-entity>

          <a-entity position="0.9 0 0.9">
            <a-plane position="0 0.01 0" rotation="-90 0 0" width="1.6" height="1.2" color="#1B5E20"></a-plane>
            <a-plane mixin="saha-cizgisi" position="0 0.012 -0.55" rotation="-90 0 0" height="1.5"></a-plane>
            <a-plane mixin="saha-cizgisi" position="0 0.012 0.55" rotation="-90 0 0" height="1.5"></a-plane>
            <a-plane mixin="saha-cizgisi" position="-0.75 0.012 0" rotation="-90 0 0" height="1.1"></a-plane>
            <a-plane mixin="saha-cizgisi" position="0.75 0.012 0" rotation="-90 0 0" height="1.1"></a-plane>
            <a-plane mixin="saha-cizgisi" position="0 0.013 0" rotation="-90 0 0" height="1.1"></a-plane>
            <a-entity position="-0.75 0.01 0">
              <a-entity mixin="kale-diregi" position="0 0.12 -0.15"></a-entity>
              <a-entity mixin="kale-diregi" position="0 0.12 0.15"></a-entity>
              <a-box position="0 0.24 0" width="0.02" height="0.02" depth="0.3" color="#FFF"></a-box>
            </a-entity>
            <a-entity position="0.75 0.01 0">
              <a-entity mixin="kale-diregi" position="0 0.12 -0.15"></a-entity>
              <a-entity mixin="kale-diregi" position="0 0.12 0.15"></a-entity>
              <a-box position="0 0.24 0" width="0.02" height="0.02" depth="0.3" color="#FFF"></a-box>
            </a-entity>
          </a-entity>

          <a-entity position="0.9 0 -0.9">
            <a-cylinder position="0 0.05 0" radius="0.45" height="0.1" color="#455A64" segments-radial="16"></a-cylinder>
            <a-cylinder position="0 0.08 0" radius="0.4" height="0.04" color="#0288D1" opacity="0.9" segments-radial="16"></a-cylinder>
            <a-cone position="0 0.18 0" radius-bottom="0.01" radius-top="0.08" height="0.2" color="#E0F7FA" opacity="0.8" segments-radial="8"></a-cone>
          </a-entity>

          <a-entity position="-0.9 0 0.9">
            <a-plane position="0 0.01 0" rotation="-90 0 0" width="1.3" height="1.3" color="#FFE082"></a-plane>
            <a-box position="-0.3 0.2 0.3" width="0.15" height="0.4" depth="0.15" color="#E91E63"></a-box>
            <a-box position="0.3 0.2 0.3" width="0.15" height="0.4" depth="0.15" color="#9C27B0"></a-box>
            <a-box position="0 0.35 0.3" width="0.45" height="0.03" depth="0.1" color="#FFEB3B"></a-box>
            <a-box position="0.3 0.18 -0.02" rotation="25 0 0" width="0.12" height="0.4" depth="0.02" color="#4CAF50"></a-box>
            <a-box position="-0.2 0.03 -0.3" width="0.4" height="0.06" depth="0.4" color="#A1887F">
              <a-box position="0 0.01 0" width="0.36" height="0.05" depth="0.36" color="#FFE082"></a-box>
            </a-box>
          </a-entity>

          <a-entity position="0 0 -0.8">
            <a-plane position="0 0.01 0" rotation="-90 0 0" width="0.8" height="0.8" color="#E1BEE7"></a-plane>
            <a-box position="0 0.08 0" width="0.18" height="0.15" depth="0.18" color="#37474F"></a-box>
            <a-torus-knot position="0 0.3 0" radius="0.06" radius-tubular="0.015" color="#FFD700" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"></a-torus-knot>
          </a-entity>

          <a-entity position="-0.3 0 0.4">
            <a-entity mixin="agac-govde" height="0.2"></a-entity>
            <a-entity mixin="agac-yaprak" position="0 0.12 0" radius="0.1"></a-entity>
          </a-entity>
          
          <a-entity position="0.4 0 -0.4">
            <a-entity mixin="agac-govde" height="0.18"></a-entity>
            <a-entity mixin="agac-yaprak" position="0 0.1" radius="0.09"></a-entity>
          </a-entity>
          
          <a-entity position="-1.3 0 -0.2">
            <a-entity mixin="agac-govde" height="0.22"></a-entity>
            <a-entity mixin="agac-yaprak" position="0 0.13 0" radius="0.11" material="color: #1B5E20"></a-entity>
          </a-entity>

        </a-entity>

      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
    
  </body>
</html>
